<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friday</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { background: #0a0a0f; color: #f0f0f0; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #friday-loading { min-height: 100%; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, rgba(0,168,255,.10), transparent 42%), #0a0a0f; }
      #friday-loading-card { text-align: center; padding: 28px; }
      #friday-loading-title { font-size: 22px; font-weight: 600; letter-spacing: .02em; }
      #friday-loading-status { margin-top: 8px; color: #a0a0a8; font-size: 13px; }
      #friday-loading-spinner { width: 22px; height: 22px; margin: 18px auto 0; border: 2px solid rgba(255,255,255,.12); border-top-color: #33ccff; border-radius: 50%; animation: friday-spin .8s linear infinite; }
      @keyframes friday-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #friday-loading-spinner { animation: none; } }
    </style>
  </head>
  <body>
    <div id="friday-loading" aria-live="polite">
      <div id="friday-loading-card">
        <div id="friday-loading-title">Friday</div>
        <div id="friday-loading-status">Starting the interface…</div>
        <div id="friday-loading-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const loading = document.getElementById('friday-loading')
        const removeLoading = () => loading?.remove()
        window.addEventListener('friday:ready', removeLoading, { once: true })
        const hideTransientReconnectNotice = () => {
          document.querySelectorAll('body *').forEach((el) => {
            const text = el.textContent?.trim() || ''
            if (el.children.length === 0 && text.toLowerCase().startsWith('reconnecting')) {
              const parent = el.parentElement
              parent?.setAttribute('data-friday-transient-status', 'hidden')
              parent?.style.setProperty('display', 'none', 'important')
            }
          })
        }
        new MutationObserver(hideTransientReconnectNotice).observe(document.documentElement, {
          childList: true,
          subtree: true,
        })
        hideTransientReconnectNotice()
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
