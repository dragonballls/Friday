<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friday</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // SSE is a browser-session transport. The always-on backend must not
      // surface its normal browser reconnect as a backend-status warning.
      (() => {
        const hideTransientReconnectNotice = () => {
          document.querySelectorAll('body *').forEach((el) => {
            const text = el.textContent?.trim() || ''
            if (el.children.length === 0 && text.toLowerCase().startsWith('reconnecting')) {
              const parent = el.parentElement
              parent?.setAttribute('data-friday-transient-status', 'hidden')
              parent?.style.setProperty('display', 'none', 'important')
            }
          })
        }
        new MutationObserver(hideTransientReconnectNotice).observe(document.documentElement, {
          childList: true,
          subtree: true,
        })
        hideTransientReconnectNotice()
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
