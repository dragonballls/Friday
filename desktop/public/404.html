<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friday - Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect - see https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <p>Redirecting to Friday...</p>
    <script>
      // Fallback for browsers without history API support
      var redirectPath = window.location.pathname.replace('/Friday/404.html', '/Friday/');
      if (window.location.hash) {
        redirectPath += window.location.hash;
      } else if (window.location.search) {
        redirectPath += window.location.search;
      }
      window.location.replace(redirectPath);
    </script>
  </body>
</html>
