name: Build Friday Desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"
      - "agent/**"
      - "core/**"
      - "plugins/**"
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"
      - "agent/**"
      - "core/**"
      - "plugins/**"
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Build Friday API sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -Recurse -Force desktop/src-tauri/binaries -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          python -m PyInstaller --onefile --name friday-api --distpath desktop/src-tauri/binaries --workpath desktop/.pyinstaller-build --specpath desktop/.pyinstaller-build --collect-submodules agent --collect-submodules core --collect-submodules plugins --collect-submodules tools desktop/api_server.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed with exit code $LASTEXITCODE" }
          Move-Item desktop/src-tauri/binaries/friday-api.exe desktop/src-tauri/binaries/friday-api-x86_64-pc-windows-msvc.exe

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Verify frontend
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw "Frontend lint failed with exit code $LASTEXITCODE" }
          npm run test
          if ($LASTEXITCODE -ne 0) { throw "Frontend tests failed with exit code $LASTEXITCODE" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Frontend build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist/index.html")) { throw "Frontend build did not produce dist/index.html" }

      - name: Regenerate valid Windows icon
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          from pathlib import Path
          import math
          import struct

          icon_path = Path("src-tauri/icons/icon.ico")
          icon_path.parent.mkdir(parents=True, exist_ok=True)

          def dib_icon(size: int) -> bytes:
              pixels = bytearray()
              center = (size - 1) / 2.0
              radius = size * 0.42
              inner_radius = size * 0.16
              for y in range(size - 1, -1, -1):
                  for x in range(size):
                      dx = x - center
                      dy = y - center
                      d = math.hypot(dx, dy)
                      if d <= radius:
                          if d <= inner_radius:
                              r, g, b = 245, 245, 255
                          else:
                              r, g, b = 88, 64, 192
                          a = 255
                      else:
                          r, g, b, a = 12, 14, 20, 255
                      pixels.extend((b, g, r, a))

              row_bytes = ((size + 31) // 32) * 4
              and_mask = bytes(row_bytes * size)
              dib = struct.pack(
                  "<IiiHHIIIIII",
                  40,
                  size,
                  size * 2,
                  1,
                  32,
                  0,
                  len(pixels),
                  0,
                  0,
                  0,
                  0,
              )
              return dib + pixels + and_mask

          sizes = [16, 32, 48, 64, 128, 256]
          images = [dib_icon(size) for size in sizes]
          header = struct.pack("<HHH", 0, 1, len(images))
          offset = 6 + 16 * len(images)
          entries = bytearray()
          for size, image in zip(sizes, images):
              width_byte = 0 if size == 256 else size
              entries.extend(struct.pack(
                  "<BBBBHHII",
                  width_byte,
                  width_byte,
                  0,
                  0,
                  1,
                  32,
                  len(image),
                  offset,
              ))
              offset += len(image)

          icon_path.write_bytes(header + entries + b"".join(images))
          print(f"Wrote deterministic DIB ICO: {icon_path} ({icon_path.stat().st_size} bytes)")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Failed to regenerate icon.ico" }
          if (-not (Test-Path "src-tauri/icons/icon.ico")) { throw "Regenerated icon.ico is missing" }

      - name: Preflight Tauri and packaging inputs
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json | Out-Null
          if (-not (Test-Path "dist/index.html")) { throw "Tauri frontendDist is missing: dist/index.html was not produced" }
          if (-not (Test-Path "src-tauri/binaries/friday-api-x86_64-pc-windows-msvc.exe")) { throw "Friday API sidecar missing" }
          if (-not (Test-Path "src-tauri/icons/icon.ico")) { throw "Tauri Windows icon was not generated" }
          $ico = [System.IO.File]::ReadAllBytes((Resolve-Path "src-tauri/icons/icon.ico"))
          if ($ico.Length -lt 22 -or $ico[0] -ne 0 -or $ico[1] -ne 0 -or $ico[2] -ne 1 -or $ico[3] -ne 0) { throw "Generated icon.ico has an invalid ICO header" }
          for ($i = 0; $i -le $ico.Length - 8; $i++) {
            if ($ico[$i] -eq 137 -and $ico[$i+1] -eq 80 -and $ico[$i+2] -eq 78 -and $ico[$i+3] -eq 71 -and $ico[$i+4] -eq 13 -and $ico[$i+5] -eq 10 -and $ico[$i+6] -eq 26 -and $ico[$i+7] -eq 10) {
              throw "Generated icon.ico unexpectedly contains an embedded PNG image"
            }
          }
          $count = [BitConverter]::ToUInt16($ico, 4)
          if ($count -lt 1) { throw "Generated icon.ico contains no image entries" }
          for ($entry = 0; $entry -lt $count; $entry++) {
            $base = 6 + ($entry * 16)
            $bytes = [BitConverter]::ToUInt32($ico, $base + 8)
            $offset = [BitConverter]::ToUInt32($ico, $base + 12)
            if ($offset -lt 6 + (16 * $count) -or $bytes -lt 40 -or $offset + $bytes -gt $ico.Length) { throw "Generated icon.ico has an out-of-range image entry" }
          }
          Write-Host "Preflight passed: frontend output, Tauri config, sidecar, and DIB ICO are valid."
          cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Tauri cargo check failed with exit code $LASTEXITCODE" }

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install --no-save @tauri-apps/cli@latest

      - name: Build Windows installer
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npx tauri build --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Tauri Windows installer build failed with exit code $LASTEXITCODE" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Friday-Windows-x64-${{ github.sha }}
          path: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
