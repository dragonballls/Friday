name: Friday self-repair

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI", "Friday integration verification"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: friday-self-repair
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out target revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run full verification
        id: verify
        continue-on-error: true
        run: python -m pytest tests -q

      - name: Run focused safe-coding verification
        if: steps.verify.outcome == 'failure'
        run: |
          python -m pytest -q \
            tests/test_agent_safe_coding_integration.py \
            tests/test_agent_safe_coding_retry.py \
            tests/test_repair_loop.py

      - name: Create isolated repair branch
        if: steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Friday Self-Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="friday/self-repair-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git push --set-upstream origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title "Friday self-repair $GITHUB_RUN_ID" --body "Automated isolated repair branch created after verification failure. No direct main mutation is performed."

      - name: Report green
        if: steps.verify.outcome == 'success'
        run: echo "Friday is green; no repair branch was needed."
