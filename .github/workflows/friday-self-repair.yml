name: Friday self-repair

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Repair target (CI, integration, or full)"
        required: false
        default: "full"
  workflow_run:
    workflows: ["CI", "Friday integration verification"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write

concurrency:
  group: friday-self-repair
  cancel-in-progress: false

jobs:
  diagnose-and-repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out failing revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Friday dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run full local verification
        id: tests
        continue-on-error: true
        run: python -m pytest tests -q

      - name: Run deterministic repair controller
        if: steps.tests.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRIDAY_SELF_REPAIR: "1"
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          # Keep this first repair pass deterministic and safe: invoke Friday's
          # existing repair/test machinery rather than allowing arbitrary shell
          # commands from an untrusted workflow payload.
          candidates = [
              Path("coding/repair_loop.py"),
              Path("coding/coding_workflow.py"),
              Path("coding/coder_controller.py"),
              Path("agent/core.py"),
          ]
          print("Self-repair controller active.")
          print("Candidate repair modules:")
          for path in candidates:
              print(f"  {'OK' if path.exists() else 'MISSING'} {path}")

          result = subprocess.run(
              [sys.executable, "-m", "pytest", "tests/test_agent_safe_coding_integration.py", "tests/test_agent_safe_coding_retry.py", "tests/test_repair_loop.py", "-q"],
              check=False,
          )
          raise SystemExit(result.returncode)

      - name: Create repair branch
        if: steps.tests.outcome == 'failure'
        run: |
          git config user.name "Friday Self-Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="friday/self-repair-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git push --set-upstream origin "$branch"

      - name: Open repair PR
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "friday/self-repair-${GITHUB_RUN_ID}" \
            --title "Friday self-repair: CI failure ${{ github.run_id }}" \
            --body "Friday detected a failing verification run and created an isolated repair branch. The existing safe coding/repair tests must pass before this PR is eligible for promotion."

      - name: Report successful verification
        if: steps.tests.outcome == 'success'
        run: echo "Friday verification is already green; no repair was necessary."
