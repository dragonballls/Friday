name: Friday integration verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Friday
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run God's Eye integration tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q core integrations plugins
          python -m pytest -q \
            core/test_gods_eye_bridge.py \
            core/test_gods_eye_context.py \
            core/test_gods_eye_intent.py \
            core/gods_eye_intent_examples_test.py \
            integrations/gods_eye/test_adapter.py \
            integrations/gods_eye/test_contract.py \
            tests/test_gods_eye_intent.py \
            tests/test_gods_eye_intent_safety.py \
            tests/test_gods_eye_plugin_discovery.py
