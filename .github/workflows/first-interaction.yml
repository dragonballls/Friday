name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Thanks for opening your first issue! A maintainer will take a look soon.

            In the meantime:
            - Check the [README](https://github.com/dragonballls/Friday#readme) for existing docs
            - Search [existing issues](https://github.com/dragonballls/Friday/issues) for duplicates
            - Join [Discussions](https://github.com/dragonballls/Friday/discussions) for questions

          pr-message: |
            🎉 Thanks for your first pull request! A maintainer will review it soon.

            Please ensure:
            - `npx tsc --noEmit` passes in `desktop/`
            - `python -m pytest` passes in the root
            - Your branch is up to date with `main`
