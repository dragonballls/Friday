name: Windows Installer

on:
  push:
    branches: [desktop-installer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pyinstaller

      - name: Build backend executable
        shell: pwsh
        run: |
          if (Test-Path desktop/backend) { Remove-Item desktop/backend -Recurse -Force }
          if (Test-Path desktop/backend-work) { Remove-Item desktop/backend-work -Recurse -Force }
          pyinstaller desktop/api_server.py --name FridayAPI --onedir --noconfirm --clean --distpath desktop/backend --workpath desktop/backend-work --collect-all quart --collect-all quart_cors --collect-all httpx --collect-all sentence_transformers
          if (!(Test-Path desktop/backend/FridayAPI/FridayAPI.exe)) { throw 'Friday API executable was not produced' }

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop installer
        working-directory: desktop
        shell: pwsh
        run: |
          $env:ELECTRON_BUILD = '1'
          npm run dist

      - name: Smoke-test installer artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter '* Setup *.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced' }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: Friday-Windows-Installer
          path: release/* Setup *.exe
          if-no-files-found: error
          retention-days: 30
